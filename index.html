<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reusable tattoo studio and visual art website templates for client projects.">
  <title>Tattoo Studio</title>
  <style>html,body{margin:0;height:100%;background:#0b0b0b}iframe{border:0;width:100%;height:100vh;display:block}</style>
</head>
<body>
  <iframe id="page" title="Tattoo Studio"></iframe>
  <script>
    const sites={david:'clones/david-v74e2db6.html',uroki:'clones/uroki-v74e2db6.html'};
    const requested=new URLSearchParams(location.search).get('site');
    const selected=sites[requested]?requested:'david';
    const frame=document.getElementById('page');
    const map=[
      [/\bDavid\b/gi,'TATTOO STUDIO'],[/\bWilliams\b/gi,'VISUAL ART'],[/hello@davidwilliams\.com/gi,'Book a Session'],
      [/\bUroki\b/gi,'TATTOO STUDIO'],[/\bNorthstar\b/gi,'TATTOO STUDIO'],[/\bSeidu\b/gi,'TATTOO STUDIO'],
      [/\bEast Legon\b/gi,'By appointment'],[/\bManhattan\b/gi,'By appointment'],[/\bNew York City\b/gi,'Studio & Gallery'],[/\bLondon\b/gi,'By appointment'],
      [/\bWarsaw\b/gi,'By appointment'],[/\bPoland\b/gi,'Studio & Gallery'],
      [/\bOlivia\b/gi,'Tattoo Client'],[/\bGorgia Ferico\b/gi,'Tattoo Client'],[/\bCo-Founder at Luca\b/gi,'Custom Session'],
      [/\bSeidu Tattoo Studio\b/gi,'Tattoo Studio'],[/\bHi, I am\b/gi,'WELCOME TO'],
      [/\bContact us\b/gi,'Book a Session'],[/\bGet in touch\b/gi,'Book a Session'],[/\bLet’s Discuss\b/gi,'Book a Session'],[/\bLet's Discuss\b/gi,'Book a Session']
    ];
    function clean(doc){
      if(!doc||!doc.body)return;
      if(doc.title)doc.title='Tattoo Studio | Custom Tattoos & Visual Art';
      const walk=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
      const nodes=[];while(walk.nextNode())if(!['SCRIPT','STYLE','NOSCRIPT'].includes(walk.currentNode.parentElement?.tagName))nodes.push(walk.currentNode);
      for(const node of nodes){let text=node.nodeValue;for(const [r,v] of map)text=text.replace(r,v);if(text!==node.nodeValue)node.nodeValue=text;}
      doc.querySelectorAll('a[href]').forEach(a=>{
        const h=(a.getAttribute('href')||'').toLowerCase();
        if(h.startsWith('mailto:')||h.startsWith('tel:')||h.includes('davidwilliams')||h.includes('uroki')||h.includes('frank-pineapples')){a.setAttribute('href','#');a.textContent='Book a Session';}
      });
      doc.querySelectorAll('meta[name="description"],meta[property="og:description"],meta[name="twitter:description"]').forEach(m=>m.setAttribute('content','Custom tattoos, paintings, sketches, and visual artwork from a modern tattoo studio.'));
      doc.querySelectorAll('meta[property="og:title"],meta[name="twitter:title"]').forEach(m=>m.setAttribute('content','Tattoo Studio | Custom Tattoos & Visual Art'));
      new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1||n.nodeType===3)clean(doc)}))).observe(doc.body,{subtree:true,childList:true});
    }
    frame.addEventListener('load',()=>clean(frame.contentDocument));
    frame.src=sites[selected];
  </script>
</body>
</html>
