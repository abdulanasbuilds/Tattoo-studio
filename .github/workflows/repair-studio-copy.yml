name: Repair studio copy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install beautifulsoup4
      - run: python3 tools/sanitize_clones.py
      - name: Commit clone updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clones/
          if git diff --cached --quiet; then echo 'No clone changes needed.'; else git commit -m 'content: apply tattoo and visual art copy'; git push; fi
