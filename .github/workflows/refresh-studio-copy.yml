name: Refresh studio copy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install HTML parser
        run: python -m pip install beautifulsoup4

      - name: Refresh clone copy
        run: python3 tools/sanitize_clones.py

      - name: Commit refreshed pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clones/
          if git diff --cached --quiet; then
            echo 'No clone changes needed.'
          else
            git commit -m 'content: refresh tattoo and visual art copy'
            git push
          fi
